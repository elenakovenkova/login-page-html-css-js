<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta
      name="description"
      content="Create an account for your business, band, or celebrity profile on our social media platform. Share content today, tomorrow, or by location."
    />
    <meta name="robots" content="index, follow" />

    <title>Create Account - Logo</title>
    <link
      rel="preload"
      href="./assets/fonts/Poppins-Regular.ttf"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link

      href="./assets/fonts/Poppins-SemiBold.ttf"

  <body>
    <main class="container">
      <section class="left">
        <h1 class="left__title" id="left-title">
          Social media shared today, tomorrow or&nbsp;by&nbsp;location
        </h1>
      </section>

      <section class="right">
        <img class="right__logo" src="./assets/images/logo.svg" alt="Logo" />
        <div>
          <h2 class="right__title" id="right-title">Create account</h2>
          <p class="right__subtitle">For business, band or celebrity.</p>
        </div>
        <form id="signup-form" method="POST">
          <div class="form-row">
            <div class="form-group">
              <label for="firstName">First name</label>
              <input
                type="text"
                id="firstName"
                name="firstName"
                required
                placeholder="Enter your first name"
              />
            </div>
            <div class="form-group">
              <label for="lastName">Last name</label>
              <input
                type="text"
                id="lastName"
                name="lastName"
                required
                placeholder="Enter your last name"
              />
            </div>
          </div>
          <div class="form-row">
            <div class="form-group">
              <label for="emailOrPhone">Email or phone number</label>
              <input
                type="text"
                id="emailOrPhone"
                name="emailOrPhone"
                required
                placeholder="user@example.com or +1234567890"
              />
            </div>
            <div class="form-group">
              <label for="dateOfBirth">Date of birth</label>
              <input
                type="date"
                id="dateOfBirth"
                name="dateOfBirth"
                required
                placeholder="Select your date of birth"
              />
            </div>
          </div>
          <div class="form-row">
            <div class="form-group">
              <label for="password">Password</label>
              <input
                type="password"
                id="password"
                name="password"
                required
                placeholder="At least 8 characters with letters and numbers"
              />
            </div>
            <div class="form-group">
              <label for="confirmPassword">Confirm password</label>
              <input
                type="password"
                id="confirmPassword"
                name="confirmPassword"
                required
                placeholder="Re-enter your password"
              />
            </div>
          </div>
          <div class="form-actions">
            <div class="checkbox-group">
              <input type="checkbox" id="rememberMe" name="rememberMe" />
              <label for="rememberMe">Remember me</label>
            </div>
            <a href="/forgot-password.html" class="link-password"
              >Forgot password?</a
            >
          </div>
          <div class="checkbox-group">
            <input type="checkbox" id="agreeTerms" name="agreeTerms" required />
            <label for="agreeTerms">
              I agree to all the
              <a href="#" class="link">Terms</a> and
              <a href="#" class="link">Privacy policy</a>
            </label>
          </div>

          <div class="form-actions buttons">
            <button type="submit" class="btn btn--primary">
              Create account
            </button>
            <button type="button" class="btn btn--google">

            </button>
          </div>
        </form>
