<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Create an account for your business, band, or celebrity profile on our social media platform. Share content today, tomorrow, or by location."
    />
    <meta name="robots" content="index, follow" />
    <title>Create Account – Logo</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./assets/styles/style.css" />
  </head>
  <body>
    <main class="container">
      <section class="left">
        <h1 class="left__title" id="left-title">
          Social media shared today, tomorrow or by location
        </h1>
      </section>

      <section class="right">
        <img
          src="./assets/images/logo.svg"
          alt="Logo"
          width="115"
          height="48"
          loading="eager"
          decoding="async"
          class="right__logo"
        />
        <div>
          <h2 class="right__title" id="right-title">Create account</h2>
          <p class="right__subtitle">For business, band or celebrity.</p>
        </div>

        <form id="signup-form" novalidate>
          <div class="form-row">
            <div class="form-group">
              <label for="firstName">First name</label>
              <input
                type="text"
                id="firstName"
                name="firstName"
                placeholder="Enter your first name"
                required
              />
            </div>
            <div class="form-group">
              <label for="lastName">Last name</label>
              <input
                type="text"
                id="lastName"
                name="lastName"
                placeholder="Enter your last name"
                required
              />
            </div>
          </div>

          <div class="form-row">
            <div class="form-group">
              <label for="emailOrPhone">Email or phone number</label>
              <input
                type="text"
                id="emailOrPhone"
                name="emailOrPhone"
                placeholder="user@example.com or +1234567890"
                required
              />
            </div>
            <div class="form-group">
              <label for="dateOfBirth">Date of birth</label>
              <input type="date" id="dateOfBirth" name="dateOfBirth" required />
            </div>
          </div>

          <div class="form-row">
            <div class="form-group">
              <label for="password">Password</label>
              <input
                type="password"
                id="password"
                name="password"
                placeholder="At least 8 characters with letters and numbers"
                required
              />
            </div>
            <div class="form-group">
              <label for="confirmPassword">Confirm password</label>
              <input
                type="password"
                id="confirmPassword"
                name="confirmPassword"
                placeholder="Re-enter your password"
                required
              />
            </div>
          </div>

          <div class="form-actions">
            <div class="checkbox-group">
              <input type="checkbox" id="rememberMe" name="rememberMe" />
              <label for="rememberMe">Remember me</label>
            </div>
            <a href="/forgot-password.html" class="link-password"
              >Forgot password?</a
            >
          </div>

          <div class="checkbox-group">
            <input type="checkbox" id="agreeTerms" name="agreeTerms" required />
            <label for="agreeTerms">
              I agree to all the <a href="#" class="link">Terms</a> and
              <a href="#" class="link">Privacy policy</a>
            </label>
          </div>

          <div class="form-actions buttons">
            <button type="submit" class="btn btn--primary">
              Create account
            </button>
            <button type="button" class="btn btn--google">
              <img
                src="./assets/images/google-logo.svg"
                alt=""
                width="20"
                height="20"
                loading="lazy"
              />
              Sign in with Google
            </button>
          </div>
        </form>

        <p class="right__login">
          Already have an account? <a href="#" class="link">Log in</a>
        </p>

        <div class="app-stores">
          <a
            href="https://play.google.com"
            class="app-stores__link"
            target="_blank"
            rel="noopener"
          >
            <img
              src="./assets/images/google-play-badge.svg"
              alt="Get it on Google Play"
              loading="lazy"
            />
          </a>
          <a
            href="https://www.apple.com/app-store/"
            class="app-stores__link"
            target="_blank"
            rel="noopener"
          >
            <img
              src="./assets/images/app-store-badge.svg"
              alt="Download on the App Store"
              loading="lazy"
            />
          </a>
        </div>
      </section>
    </main>

    <script type="module" src="./scripts/ui.js"></script>
    <script type="module" src="./scripts/formHandler.js"></script>
  </body>
</html>
